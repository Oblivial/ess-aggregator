[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ess-aggregator"
version = "0.1.0"
description = "Aggregate European Social Survey (ESS) micro-data into country-year macro units for multilevel/panel analyses."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "py-ess @ git+https://github.com/Oblivial/py-ess.git@v0.1.0b3",
]

[project.optional-dependencies]
polars = ["polars>=1.0"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
ess-aggregate = "ess_aggregator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
